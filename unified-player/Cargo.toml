[package]
name = "unified-player"
version = "0.1.0-alpha.1"
authors = ["bababoyy"]
edition = "2021"
license = "MIT"
publish = false
description = "A provider-neutral terminal music player for Spotify and experimental YouTube Music"
repository = "https://github.com/bababoyy/unified-player"
keywords = ["spotify", "tui", "ratatui", "player"]
readme = "../README.md"

[dependencies]
anyhow = "1.0.103"
age = { version = "0.12.1", optional = true, default-features = false }
atomicwrites = "0.4.4"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive", "string"] }
config_parser2 = "0.1.7"
crossterm = "0.29.0"
dirs-next = "2.0.0"
librespot-connect = { version = "0.8.0", optional = true }
librespot-core = { version = "0.8.0" }
librespot-playback = {version = "0.8.0", optional = true, default-features = false, features = ["native-tls"]}
librespot-metadata = { version = "0.8.0" }
chrono = "0.4.45"
chrono-humanize = "0.2.3"
reqwest = { version = "0.13.4", features = ["json", "query", "form", "blocking"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "mp4"] }
rspotify = {version = "0.16.1", features = ["cli"] }
base64 = "0.22.1"
sha2 = "0.11.0"
sha1 = "0.11.0"
open = "5.3.6"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = [
	"rt",
	"rt-multi-thread",
	"macros",
	"process",
	"sync",
	"time",
] }
toml = "1.1.2"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rand = "0.10.1"
maybe-async = "0.2.11"
async-trait = "0.1.89"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
tracing = "0.1.44"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
souvlaki = { version = "0.8.3", optional = true }
image = { version = "0.25.10", optional = true }
notify-rust = { version = "4.18.0", optional = true, default-features = false, features = [
	"d",
] }
flume = "0.12.0"
serde_json = "1.0.150"
regex = "1.12.4"
daemonize = { version = "0.5.0", optional = true }
rustfft = { version = "6", optional = true }
zeroize = { version = "1.9.0", optional = true }
ttl_cache = "0.5.1"
clap_complete = "4.6.6"
which = "8.0.4"
fuzzy-matcher = { version = "0.3.7", optional = true }
html-escape = "0.2.13"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
unicode-bidi = "0.3.18"
url = "2.5.8"
futures = "0.3.32"
ytmapi-rs = { version = "0.3.2", features = ["reqwest", "rustls"] }
stream-download = { version = "0.24.0", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
# Vendored, pinned EJS port; see crates/ytdlp-ejs/UPSTREAM.md.
ytdlp-ejs = { version = "0.1.1", path = "../crates/ytdlp-ejs", optional = true, default-features = false, features = ["qjs", "parallel"] }
thiserror = "2"
tokio-util = "0.7.16"
tokio-tungstenite = "0.28.0"
ratatui-image = { version = "11.0.6", optional = true, default-features = false, features = ["crossterm"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies.winit]
version = "0.30.13"
optional = true

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
windows-permissions = { version = "0.2.4", optional = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58.0"
features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_UI_WindowsAndMessaging",
]
optional = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"], optional = true }

[features]
alsa-backend = ["streaming", "librespot-playback/alsa-backend"]
pulseaudio-backend = ["streaming", "librespot-playback/pulseaudio-backend"]
rodio-backend = ["streaming", "librespot-playback/rodio-backend"]
portaudio-backend = ["streaming", "librespot-playback/portaudio-backend"]
jackaudio-backend = ["streaming", "librespot-playback/jackaudio-backend"]
rodiojack-backend = ["streaming", "librespot-playback/rodiojack-backend"]
sdl-backend = ["streaming", "librespot-playback/sdl-backend"]
gstreamer-backend = ["streaming", "librespot-playback/gstreamer-backend"]
streaming = ["librespot-playback", "librespot-connect", "rustfft"]
media-control = ["souvlaki", "winit", "windows"]
image = ["ratatui-image", "dep:image"]
sixel = ["image"]
pixelate = ["image"]
notify = ["notify-rust"]
daemon = ["daemonize", "streaming"]
fzf = ["fuzzy-matcher"]
private-capture = ["dep:age", "dep:rustix", "dep:windows-permissions", "dep:zeroize"]
# Solve YouTube player challenges with embedded QuickJS instead of Node.js.
youtube-quickjs = ["dep:ytdlp-ejs"]

# Keep one stable daily-driver feature profile. Alternate audio backends must
# be selected with --no-default-features so they cannot collide with rodio.
standard = ["rodio-backend", "media-control", "youtube-quickjs"]
ci = ["standard", "image", "notify", "fzf"]
default = ["standard"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["async-trait"]

# Archive/installer rehearsal; Cargo registry publication remains disabled.
[package.metadata.dist]
dist = true

[dev-dependencies]
static_assertions = "1.1.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
junction = { version = "2.0.0", default-features = false }
