# Watch jobs for UI work: `bacon preview` redraws a screen on every save.
# Change the screen/scenario/sizes in the job below, or run a one-off with
# `bacon preview -- <extra args>` (extra args are appended to the command).
#
# Every job builds the `ci` feature set, like `scripts/dev.sh` (see
# docs/build-features.md), so bacon and the script share one target/ tree.

default_job = "check"

[jobs.check]
command = [
    "cargo", "check", "--color", "always", "--all-targets",
    "-p", "unified-player", "--no-default-features", "--features", "ci",
]
need_stdout = false

[jobs.test]
command = [
    "cargo", "test", "--color", "always",
    "-p", "unified-player", "--no-default-features", "--features", "ci",
]
need_stdout = true

[jobs.preview]
command = [
    "cargo", "run", "--quiet", "--color", "always",
    "-p", "unified-player", "--no-default-features", "--features", "ci", "--",
    "demo", "screen", "spotify-playlist",
    "--scenario", "ready",
    "--size", "80x24", "--size", "120x35",
    "--color", "always",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[keybindings]
p = "job:preview"
