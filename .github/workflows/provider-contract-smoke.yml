name: Provider Contract Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_external_network:
        description: Run the public YouTube playback contract against the live service
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provider-contract-smoke
  cancel-in-progress: false

jobs:
  public-youtube-playback:
    if: inputs.confirm_external_network
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libasound2-dev libdbus-1-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-26
        with:
          toolchain: 1.96.1

      - name: Run public native resolver contract
        run: cargo test --locked -p unified-player --no-default-features client::youtube::playback::tests::native_resolver_opens_a_decodable_public_audio_stream -- --ignored --exact --test-threads=1
