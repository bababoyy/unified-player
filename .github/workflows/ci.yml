name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      os:
        description: Operating system (all starts three runners)
        type: choice
        default: windows-latest
        options: [windows-latest, ubuntu-latest, macos-latest, all]
      profile:
        description: Cargo profile (all tests three feature sets)
        type: choice
        default: standard
        options: [standard, ci, minimal, all]
      clippy:
        description: Also run strict Clippy (existing lint debt may fail)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    # Same-repository PR commits already receive the push check. Fork PRs do not.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install Rust formatting tool
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 2026-07-26
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Cargo format (no compilation)
        run: cargo fmt --all --check
      - name: UI terminal ownership
        run: python scripts/check-ui-terminal-ownership.py
      - name: Test inexpensive CI gates
        run: python scripts/test_ci_checks.py
      - name: Verify bundled EJS bytes
        run: python scripts/check_ejs_assets.py
      - name: Check publication paths without Cargo
        run: |
          python scripts/check_publication_surface.py --self-test
          python scripts/check_publication_surface.py --tracked-only
      - name: Check dependency exception dates
        run: |
          python scripts/check_dependency_policy.py --self-test
          python scripts/check_dependency_policy.py --check-exceptions
      - name: Install actionlint
        run: curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash | bash -s -- 1.7.12
      - name: Lint workflows
        run: ./actionlint
      - name: Check spelling
        uses: crate-ci/typos@3bc303c295c081add5df4a4d52a1e117f2fb2dce # 2026-07-26
      - name: Check dependency use (precompiled only)
        run: |
          archive="$RUNNER_TEMP/cargo-machete.tar.gz"
          curl -sSfL https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz -o "$archive"
          echo "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/cargo-machete"
      - name: Scan changed history without printing matched material
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check_secrets.sh

  rust-ci:
    # No push, PR or schedule may allocate a build runner.
    if: github.event_name == 'workflow_dispatch'
    needs: fast-checks
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["windows-latest","ubuntu-latest","macos-latest"]' || format('["{0}"]', inputs.os)) }}
        profile: ${{ fromJSON(inputs.profile == 'all' && '["standard","ci","minimal"]' || format('["{0}"]', inputs.profile)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/ci/${{ matrix.profile }}
      RUST_BACKTRACE: "1"
      CI_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify checkout bytes before compilation
        run: python scripts/check_ejs_assets.py
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libasound2-dev libdbus-1-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 2026-07-26
        with:
          toolchain: 1.96.1
          components: clippy
      - name: Restore Cargo dependencies and compiled output
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/ci/
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Test selected profile
        run: bash scripts/check_rust_profile.sh test "$CI_PROFILE"
      - name: Clippy selected profile
        if: inputs.clippy
        run: bash scripts/check_rust_profile.sh clippy "$CI_PROFILE"
      - name: Save first cache even when a test fails
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/ci/
          key: ${{ steps.cache.outputs.cache-primary-key }}
