[workspace]
members = [
    "lyric_finder",
    "unified-player",
]
exclude = ["crates/ytdlp-ejs"]
resolver = "2"

[profile.dev]
# Line tables keep backtraces readable while cutting debug-info generation,
# which dominates incremental rebuilds of the UI.
debug = "line-tables-only"

# Dependency debug info is rarely stepped into and made up most of target/.
[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"

# Used only by the explicitly requested binary packaging rehearsal.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = 1 }
perf = { level = "warn", priority = 2 }
style = { level = "warn", priority = 3 }
complexity = { level = "warn", priority = 4 }

module_name_repetitions = { level = "allow", priority = 20 }
cast_possible_truncation = { level = "allow", priority = 20 }
cast_sign_loss = { level = "allow", priority = 20 }
cast_possible_wrap = { level = "allow", priority = 20 }
cast_precision_loss = { level = "allow", priority = 20 }
missing_errors_doc = { level = "allow", priority = 20 }
similar_names = { level = "allow", priority = 20 }
too_many_lines = { level = "allow", priority = 20 }
