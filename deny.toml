[graph]
all-features = true

[advisories]

[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
reason = "owner accepted until 2026-11-22: librespot only verifies the Spotify server handshake with a public key; no application RSA private key is used and no patched release exists"

[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "owner accepted until 2026-11-22: RUSTSEC-2024-0436 is informational/unmaintained only and paste is an optional image/AVIF transitive build dependency; no patched upstream release exists"

[[advisories.ignore]]
id = "RUSTSEC-2025-0069"
reason = "owner accepted through 2026-11-22: INFO/unmaintained only; optional Unix daemon path is excluded from standard/ci/CD but included by default Nix withDaemon; app uses the basic Daemonize::new().start() path; track daemonix migration"

[[advisories.ignore]]
id = "RUSTSEC-2026-0192"
reason = "owner accepted through 2026-11-22: INFO/unmaintained only; ttf-parser appears only in the cargo-deny all-target graph through winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser, is absent from every supported release target/profile, and upstream migration to skrifa is the follow-up"

[[advisories.ignore]]
id = "RUSTSEC-2026-0194"
reason = "owner accepted through 2026-11-22: librespot-pinned quick-xml 0.38 uses plain Reader without attribute iteration, the optional Windows notification 0.37 path only escapes and generates XML, and 0.41 is fixed; no compatible narrow update exists, so track upstream"

[[advisories.ignore]]
id = "RUSTSEC-2026-0195"
reason = "owner accepted through 2026-11-22: librespot-pinned quick-xml 0.38 uses plain Reader rather than NsReader, the optional Windows notification 0.37 path only escapes and generates XML, and 0.41 is fixed; no compatible narrow update exists, so track upstream"

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/DelSkayn/rquickjs.git"]
